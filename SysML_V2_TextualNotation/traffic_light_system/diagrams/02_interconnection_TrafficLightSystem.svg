@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
left to right direction
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec def "TrafficLightSystem" as E1  <<(T,blue) part  def>> [[psysml:ee06cf85-831e-4be1-a890-6f7fac74f550 ]] {
rec usage "tmc: TrafficManagementCenter" as E3 [[psysml:d290b3e7-1cac-49fb-a668-5b16a1971810 ]] {
portout "^sendPort: ControlPort  " as E4  <<(T,blue) port>> [[psysml:22f8fcfe-94d5-4d4f-bc44-05bab48ab3bd ]] 
portin "^servicePort: ~ServicePort  " as E5  <<(T,blue) port>> [[psysml:5dc54f34-d8f0-49ab-b4b1-360e7233576c ]] 
}
rec usage "tlc1: BasicTrafficLightController" as E6 [[psysml:7fd7de61-e96b-43ac-95e3-aded26ff57e6 ]] {
portout "^servicePort: ServicePort  " as E7  <<(T,blue) port>> [[psysml:8caae48f-ad53-462f-be33-2c2553e821aa ]] 
portin "^recvPort: ~ControlPort  " as E8  <<(T,blue) port>> [[psysml:3fe72d3b-e3e4-4ca1-9a5d-a726b771401b ]] 
}
rec usage "tlc2: BasicTrafficLightController" as E9 [[psysml:8a12463a-10eb-4319-aac3-cffea10c80e5 ]] {
portout "^servicePort: ServicePort  " as E10  <<(T,blue) port>> [[psysml:8caae48f-ad53-462f-be33-2c2553e821aa ]] 
portin "^recvPort: ~ControlPort  " as E11  <<(T,blue) port>> [[psysml:3fe72d3b-e3e4-4ca1-9a5d-a726b771401b ]] 
}
}
note as E2
[[psysml:d7489745-fb93-40ef-8bb9-ecfcca34b6d2 @]]Main system that contains the parts

end note 
