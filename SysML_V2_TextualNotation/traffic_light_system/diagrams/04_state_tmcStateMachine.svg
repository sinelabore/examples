@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle

rec usage "tmcStateMachine" as E1 [[psysml:8853005d-b715-4cf5-8243-3840cb85cb50 ]] {
rec usage "PreOperational" as E2  <<(T,blue) state>> [[psysml:d25162b8-96ca-42be-adc2-a0a81846f04f ]] {
}

rec usage "Operational" as E3  <<(T,blue) state>> [[psysml:70b9a567-a462-4443-b147-b75271e2a0b7 ]] {
}

rec usage "OperationalWihtServiceNeed" as E4  <<(T,blue) state>> [[psysml:8b39702e-a62d-46f8-87f3-e7233aced778 ]] {
desc "OperationalWihtServiceNeed" as E4  : **entry** scheduleServiceCall
}

desc "tmcStateMachine" as E1  : **entry** 
desc "tmcStateMachine" as E1  : **do** getMsg
[*] - -> E2 [[psysml:f436ebf2-8494-49bd-8ea2-69739a57ccba ]] 
}

E2  - -> E3 [[psysml:b3247a04-4104-48d1-a112-015adb50e994 ]] : Occurrence /send TLCEvent::evOperational via sendPort
E3  - -> E4 [[psysml:e37a8af3-b797-47dc-958e-c2b8f43608a9 ]] : Occurrence 
@enduml

